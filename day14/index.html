<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 200px;
            width: 200px;
            border: 1px solid black;
            float: left;
            font-size: 100px;
            text-align: center;
        }
        .box:nth-child(2) {
            position: absolute;
            top: 10px;
            right: 0;
        } 
        .box:nth-child(3) {
            position: relative;
            top: 10px;
            right: 20px;
        }
    </style>
   
</head>
<body>
    <div class="box"> 1</div>
    <div class="box">2  </div>
    <div class="box">3  </div>
</body>
</html>
