<!DOCTYPE html>
<html lang="en">
<head>
    <style>
     .parent{
        width: 1000px;
        height: 500px;
        display: flex;
        position: relative;
        margin: auto;
        border: 1px solid black;
     }
     .box1{
        height: 100px;
        width: 100px;
        /* border: 1px solid red; */
        background-color: green;
        top: 0;
        left: 0;
        position: absolute;
        font-size: 100px;
        text-align: center;
        transition: 500ms;
     }
     .parent:hover .box1{
        top: 200px;
        left: 400px;
     }
     .box2{
        height: 100px;
        width: 100px;
        /* border: 1px solid red; */
        background-color: red;
        bottom: 0;
        right: 0;
        position: absolute;
        font-size: 100px;
        text-align: center;
        transition: 500ms;
     }
     .parent:hover .box2{
        bottom: 200px;
        right:400px;
     }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box1">1</div>
        <div class="box2">2</div>
    </div>
</body>
</html>
