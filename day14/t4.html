<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .parent{
            width: 1000px;
            height: 500px;
            border: 1px solid black;
            margin: auto;
            display: flex;
            position: relative;
        }
       .box1{
        width: 100px;
        height: 100px;
        position: absolute;
        background-color: red;
        font-size: 100px;
        text-align: center;
        transition: 500ms;
        top: 0;
        left: 0;
       }
       .parent:hover .box1{
        top: 0px;
        left: 900px;
       }
       .box2{
        width: 100px;
        height: 100px;
        position: absolute;
        background-color: rgb(255, 230, 0);
        transition: 500ms;
        font-size: 100px;
        text-align: center;
        top: 0;
        right: 0;
       }
       .parent:hover .box2{
        top: 400px;
        right: 0px;
       }
       .box3{
        width: 100px;
        height: 100px;
        position: absolute;
        background-color: rgb(0, 255, 229);
        transition: 500ms;
        font-size: 100px;
        text-align: center;
        bottom: 0;
        right: 0;
       }
       .parent:hover .box3{
        
        right: 900px;
       }
       .box4{
        width: 100px;
        height: 100px;
        position: absolute;
        background-color: rgb(225, 0, 255);
        transition: 500ms;
        font-size: 100px;
        text-align: center;
        bottom: 0;
        left: 0;
       }
       .parent:hover .box4{
        bottom: 400px;
        /* left: 0px; */
       }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
    </div>
</body>
</html>
