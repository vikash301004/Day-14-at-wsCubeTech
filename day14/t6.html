<!DOCTYPE html>
<html lang="en">
<head>
    <style>
     .parent{
        width: 1000px;
        height: 500px;
        display: flex;
        margin: auto;
        position: relative;
        border: 1px solid black;
     }
     .box1{
        height: 100px;
        width: 100px;
        position: absolute;
        background-color: red;
        font-size: 100px;
        text-align: center;
        transition: 500ms;
        top: 0;
        left: 450px;
     }
     .parent:hover .box1{
        top: 100px;
     }
     .box2{
        height: 100px;
        width: 100px;
        position: absolute;
        background-color: rgb(242, 255, 0);
        font-size: 100px;
        text-align: center;
        transition: 500ms;
        top: 200px;
        right: 0;
     }
     .parent:hover .box2{
        right: 400px;
     }
     .box3{
        height: 100px;
        width: 100px;
        position: absolute;
        background-color: rgb(255, 0, 187);
        font-size: 100px;
        text-align: center;
        transition: 500ms;
        bottom: 0;
        right: 450px;
     }
     .parent:hover .box3{
        bottom: 100px;
     }
     .box4{
        height: 100px;
        width: 100px;
        position: absolute;
        background-color: rgb(0, 183, 255);
        font-size: 100px;
        text-align: center;
        transition: 500ms;
        bottom: 200px;
        left: 0;
     }
     .parent:hover .box4{
        left: 400px;
     }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
    </div>
</body>
</html>
