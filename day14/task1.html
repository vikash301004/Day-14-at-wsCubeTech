<!DOCTYPE html>
<html lang="en">
<head>
   <style>
   .parent{
    display: flex;
    width: 1000px;
    height: 500px;
    border: 1px solid black;
    margin: auto;
    position: relative;
   }
   .box{
      width: 150px;
      height: 150px;
      border: 1px solid red;
      font-size: 100px;
      align-items: center;
   }
   .box:nth-child(2){
    position: absolute;
    bottom: 0;
    left: 0;
   }
   </style>
</head>
<body>
    <div class="parent">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
