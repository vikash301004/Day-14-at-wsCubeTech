<!DOCTYPE html>
<html lang="en">
<head>
   <style>
   .parent{
    width: 1000px;
    height: 500px;
    margin: auto;
    display: flex;
    border: 1px solid black;
    position: relative;
   }
   .box{
    height: 100px;
    width: 100px;
    background-color: red;
    position: absolute;
    top: 0;
    left: 0;
    transition: 500ms;
   }
   .parent:hover .box {
    left: 900px;
    top: 400px;
    background-color: blue;
   }
   </style>
</head>
<body>
    <div class="parent">
        <div class="box"></div>
    </div>
    
</body>
</html>
